version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: waste_exchange_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./apps/api:/app
    networks:
      - waste_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: waste_exchange_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./apps/web/.env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - waste_network

networks:
  waste_network:
    driver: bridge
